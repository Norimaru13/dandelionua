<body>
  <header class="site-header">
    <div class="menu-wrap">
      <button type="button" class="menu-btn" data-menu-toggle aria-expanded="false">
        <span class="menu-btn-icon">
          <img class="icon-off" src="assets/dandelion_button.png" data-img="button" alt="">

        <img src="assets/language_button.png" data-img="lang" alt="">

      <div class="lang-menu" data-lang-menu>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
