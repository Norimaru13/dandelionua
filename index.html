<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dandelion_ua</title>
  <link rel="icon" href="assets/dandelion_ua_site_logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="assets/embed/manifest.js"></script>
  <script src="assets/embed/apply.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="menu-wrap">
      <button type="button" class="menu-btn tex-btn" data-menu-toggle aria-expanded="false">
        <span class="btn-tex">
          <img class="icon-off" src="assets/dandelion_button.png" data-img="button" alt="">
          <img class="icon-hover" src="assets/dandelion_button_hovered.png" data-img="button_hover" alt="">
          <img class="icon-press" src="assets/dandelion_button_pressed.png" data-img="button_press" alt="">
          <img class="icon-active" src="assets/dandelion_button_active.png" alt="">
        </span>
      </button>
      <div class="side-menu-clip">
        <aside class="side-menu" data-side-menu>
          <a class="side-slot" href="https://modrinth.com/user/dandelion_ua" target="_blank" rel="noopener noreferrer">
            <img src="assets/icons/modrinth.svg" alt="">
          </a>
          <button type="button" class="side-slot">
            <img src="assets/icons/curseforge.svg" alt="">
          </button>
          <button type="button" class="side-slot">
            <img src="assets/icons/mcreator.svg" alt="">
          </button>
          <button type="button" class="side-slot">
            <img src="assets/icons/telegram.svg" alt="">
          </button>
          <button type="button" class="side-slot">
            <img src="assets/icons/discord.svg" alt="">
          </button>
          <button type="button" class="side-slot">
            <img src="assets/icons/reddit.svg" alt="">
          </button>
        </aside>
      </div>
    </div>
    <img class="header-title" src="assets/dandelion_ua_header.png" data-img="header" alt="">
    <div class="lang-switch">
      <button type="button" class="lang-toggle tex-btn" data-lang-toggle aria-expanded="false">
        <span class="btn-tex">
          <img class="icon-off" src="assets/language_button.png" data-img="lang" alt="">
          <img class="icon-hover" src="assets/language_button_hovered.png" alt="">
          <img class="icon-press" src="assets/language_button_pressed.png" alt="">
          <img class="icon-active" src="assets/language_button_active.png" alt="">
        </span>
      </button>
      <div class="lang-menu" data-lang-menu>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="ua">UA</button>
      </div>
    </div>
  </header>
  <div class="header-stripes"></div>
  <main class="page-body">
    <p class="intro" data-i18n="intro">I am Dandelion, a Ukrainian modder focused on atmospheric mechanics, small details, and captivating gameplay.</p>
  </main>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
