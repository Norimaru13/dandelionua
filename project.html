        <img class="close-off" src="assets/icons/cross_button.png" alt="">
        <img class="close-hover" src="assets/icons/cross_button_hovered.png" alt="">
        <img class="close-press" src="assets/icons/cross_button_pressed.png" alt="">
      </button>
      <div data-account-form-box>
        <form data-account-form>
          <label>
            <span data-i18n="account_nick">nick</span>
            <input name="nick" maxlength="20" autocomplete="username">
          </label>
          <label>
            <span data-i18n="account_password">password</span>
            <input name="password" type="password" autocomplete="current-password">
          </label>
          <p class="account-error" data-account-error></p>
          <div class="account-actions">
            <button type="submit" data-i18n="account_login">log in</button>
            <button type="button" data-account-register data-i18n="account_register">create profile</button>
          </div>
        </form>
      </div>
      <div data-account-session hidden>
        <p class="account-session-nick" data-account-session-nick></p>
        <button type="button" data-account-logout data-i18n="account_logout">log out</button>
      </div>
