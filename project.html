  <div class="site-pane">

  <div class="site-stack">

    <aside class="sidebar sidebar-start" aria-hidden="true"></aside>
  <main class="page-body">
    <h1 class="project-page-title" data-project-title></h1>

      <img src="assets/icons/dandelion.png?v=77" alt="">
    </button>
  </footer>
  </div>
  </div>
  </div>
  <div class="scroll-rail" data-scroll-rail aria-hidden="true">
    <div class="scroll-thumb" data-scroll-thumb></div>
  </div>
  </div>
  <div class="account-modal" data-account-modal hidden>
    <div class="account-dialog">
      <button type="button" class="account-close" data-account-close data-i18n-title="account_close">
        <img class="close-off" src="assets/icons/cross_button.png" alt="">
        <img class="close-hover" src="assets/icons/cross_button_hovered.png" alt="">
        <img class="close-press" src="assets/icons/cross_button_pressed.png" alt="">
      </button>
      <div data-account-form-box>
        <div class="post-lang-tabs" data-account-tabs>
          <button type="button" class="post-lang-tab is-active" data-account-tab="login" data-i18n="account_login">log in</button>
          <button type="button" class="post-lang-tab" data-account-tab="register" data-i18n="account_create">create account</button>
        </div>
        <form class="account-form" data-account-form data-account-mode="login">
          <label>
            <span data-i18n="account_nick">nick</span>
            <input name="nick" maxlength="20" autocomplete="username">
          </label>
          <label>
            <span data-i18n="account_password">password</span>
            <span class="pass-row">
              <input name="password" type="password" autocomplete="current-password">
              <button type="button" class="pass-eye" data-pass-eye data-i18n-tip="account_show_password" data-i18n-title="account_show_password">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6 5 2.3 10.2 2 12c.3 1.8 4 7 10 7s9.7-5.2 10-7c-.3-1.8-4-7-10-7zm0 10.2A3.2 3.2 0 1 1 12 8.8a3.2 3.2 0 0 1 0 6.4z"/></svg>
              </button>
            </span>
          </label>
          <label data-account-repeat>
            <span data-i18n="account_password_repeat">repeat password</span>
            <span class="pass-row">
              <input name="password2" type="password" autocomplete="new-password">
              <button type="button" class="pass-eye" data-pass-eye data-i18n-tip="account_show_password" data-i18n-title="account_show_password">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6 5 2.3 10.2 2 12c.3 1.8 4 7 10 7s9.7-5.2 10-7c-.3-1.8-4-7-10-7zm0 10.2A3.2 3.2 0 1 1 12 8.8a3.2 3.2 0 0 1 0 6.4z"/></svg>
              </button>
            </span>
          </label>
          <p class="account-error" data-account-error></p>
          <div class="account-actions">
            <button type="submit" data-account-submit data-i18n="account_login">log in</button>
          </div>
        </form>
      </div>
      <div data-account-session hidden>
        <p class="account-session-nick" data-account-session-nick></p>
        <div class="account-nick-edit" data-account-nick-edit hidden>
          <input data-account-new-nick maxlength="20" autocomplete="username">
          <button type="button" data-account-nick-save data-i18n="post_save">save</button>
        </div>
        <div class="account-actions">
          <button type="button" data-account-nick-open data-i18n="account_edit_nick">edit nick</button>
          <button type="button" data-account-logout data-i18n="account_logout">log out</button>
        </div>
      </div>
    </div>
  </div>
